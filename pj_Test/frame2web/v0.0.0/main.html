<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Live Control + Webcam + System Info</title>
<style>
body { font-family:sans-serif; background:#2c3e50; color:#ecf0f1; text-align:center; padding:20px; }
.control-group { margin:10px 0; }
button, input[type=range] { padding:8px 15px; border-radius:6px; border:none; cursor:pointer; background:#3498db; color:#fff; }
button:hover { background:#2980b9; }
video { border:4px solid #4CAF50; border-radius:10px; margin-top:20px; width:640px; height:480px; }
#sysInfo { margin-top:20px; text-align:left; display:inline-block; background: rgba(0,0,0,0.3); padding:10px 20px; border-radius:8px; }
</style>
</head>
<body>

<h1>Live Control + Webcam + Info</h1>

<div class="control-group">
    <label for="mySlider">Slider:</label>
    <input type="range" id="mySlider" min="0" max="100" value="50">
    <span id="sliderValue">50</span>
</div>

<div class="control-group">
    <label for="mySwitch">Switch:</label>
    <input type="checkbox" id="mySwitch">
</div>

<div class="control-group">
    <button id="loadJson">Load JSON</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
    <button id="saveJson">Save JSON</button>
</div>

<video id="cam" autoplay playsinline></video>

<div id="sysInfo"></div>

<script src="controlLibLive.js"></script>
<script>
// Register controls
controlLibLive.addSlider("mySlider", "sliderValue");
controlLibLive.addSwitch("mySwitch");

// JSON load/save
const fileInput = document.getElementById('fileInput');
document.getElementById('loadJson').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
    controlLibLive.loadJsonFromFile(fileInput).then(state => {
        controlLibLive.displayInfo(document.getElementById('sysInfo'), state);
    }).catch(err => alert("Error: "+err));
});
document.getElementById('saveJson').addEventListener('click', () => controlLibLive.saveJsonToFile());

// Start webcam
const videoEl = document.getElementById('cam');
controlLibLive.startWebcam(videoEl).catch(err => alert("Cannot open webcam: " + err.message));

// Example: live update display every second
setInterval(() => {
    controlLibLive.displayInfo(document.getElementById('sysInfo'), controlLibLive.saveState());
}, 1000);
</script>

</body>
</html>
